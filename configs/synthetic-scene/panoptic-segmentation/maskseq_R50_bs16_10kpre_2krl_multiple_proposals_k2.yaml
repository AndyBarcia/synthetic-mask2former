_BASE_: "maskformer2_R50_bs16.yaml"
MODEL:
  WEIGHTS: "detectron2://ImageNetPretrained/torchvision/R-50.pkl"
  MASK_FORMER:
    STANDARD_CLASSIFICATION: true
    PROPOSALS_PER_GT: 2
    FUSED_THING_MASKS: false
    NUM_OBJECT_QUERIES: 100
    MASK_LOSS_TYPE: point
    TRAIN_NUM_POINTS: 12544
    CLASS_WEIGHT: 2.0
    MASK_WEIGHT: 5.0
    DICE_WEIGHT: 5.0
    QUERY_BIAS_WEIGHT: 0.0
    QUERY_BIAS_MATCHER_WEIGHT: 0.0
    OBJECT_DEC_LAYERS: 5
    OBJECT_PRETRAIN_BEST_OF_K: 32
    OBJECT_DEC_EOF_THRESHOLD: 0.5
    OBJECT_DEC_COLLAPSE_MASKS: true
    OBJECT_RL_NUM_SAMPLES: 4
    OBJECT_RL_REWARD: batch_rq
SOLVER:
  IMS_PER_BATCH: 16
  BASE_LR: 0.0001
  MAX_ITER: 10000
  STEPS: [8000, 9500]
  WARMUP_ITERS: 0
  CHECKPOINT_PERIOD: 500
TEST:
  EVAL_PERIOD: 500
SEED: 42
OUTPUT_DIR: "output/synth_pan_R50_bs16_10kpre_2krl_multiple_proposals_k2"
TRAINING:
  MODE: supervised
  RL:
    MAX_ITER: 2000
    BASE_LR: 0.00001
    STEPS: [1600, 1900]
    WARMUP_ITERS: 0
