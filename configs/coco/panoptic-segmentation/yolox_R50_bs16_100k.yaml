_BASE_: maskformer2_R50_bs16_50ep.yaml
MODEL:
  META_ARCHITECTURE: YOLOXObjectDecoder
  # ImageNet backbone only: segmentation and object-decoder modules start fresh.
  WEIGHTS: detectron2://ImageNetPretrained/torchvision/R-50.pkl
  SEM_SEG_HEAD:
    NAME: YOLOXHead
  YOLOX:
    WIDTH: 160
    TOPK: 300
    MAX_STEPS: 64
    BOX_FREE: false
    FREEZE_BACKBONE: false
    FREEZE_PIXEL_DECODER: false
    FREEZE_MEMORY: false
    FREEZE_PROPOSALS: false
  MASK_FORMER:
    OBJECT_DEC_LAYERS: 5
    OBJECT_DEC_POSITION_ENCODING: false
    OBJECT_DEC_COLLAPSE_MASKS: false
    OBJECT_DEC_PREFIX_TREE_BRANCHES: 4
    OBJECT_RL_ONLY: false
    OBJECT_RL_WEIGHT: 0.0
    TEST:
      PANOPTIC_ON: true
      INSTANCE_ON: false
      SEMANTIC_ON: false
SOLVER:
  BASE_LR: 0.0001
  MASK_PROPOSAL_MULTIPLIER: 0.1
  BACKBONE_MULTIPLIER: 0.1
  MAX_ITER: 100000
  STEPS: [80000, 95000]
  WARMUP_ITERS: 0
  IMS_PER_BATCH: 16
  WEIGHT_DECAY: 0.01
  WEIGHT_DECAY_NORM: 0.01
  WEIGHT_DECAY_EMBED: 0.01
  CHECKPOINT_PERIOD: 5000
  AMP:
    ENABLED: false
  CLIP_GRADIENTS:
    ENABLED: true
    CLIP_TYPE: full_model
    CLIP_VALUE: 1.0
TEST:
  EVAL_PERIOD: 5000
INPUT:
  IMAGE_SIZE: 512
  MIN_SIZE_TEST: 512
  MAX_SIZE_TEST: 2048
TRAINING:
  MODE: supervised
SEED: 42
OUTPUT_DIR: output/yolox_R50_bs16_100k
